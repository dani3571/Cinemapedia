name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Descargar dependencias
        run: flutter pub get

      - name: Crear archivo env seguro
        run: echo "THE_MOVIEDB_KEY=${{ secrets.THE_MOVIEDB_KEY }}" > .env
        
      - name: Construir el APK
        run: flutter build apk --release

      - name: Entregar el APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemapedia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
